services:
  postgres:
    image: postgres:16
    container_name: stafftrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stafftrack
      POSTGRES_PASSWORD: stafftrack_pass
      POSTGRES_DB: stafftrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stafftrack -d stafftrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OR-Tools auto-scheduler (scheduler/). Stateless: Next.js sends it JSON, it never touches the DB.
  scheduler:
    build: ./scheduler
    container_name: stafftrack-scheduler
    restart: unless-stopped
    environment:
      # must match SCHEDULER_SECRET in .env; the fallback is only for local dev
      SCHEDULER_SECRET: ${SCHEDULER_SECRET:-local-dev-scheduler-secret}
    ports:
      - "8000:8000"

volumes:
  pgdata:
